<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Moovees - Movie and TV news and review by Alan</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #202020;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* --- Logo --- */
    .logo {
      max-width: 320px;
      width: 100%;
      flex-shrink: 0;
    }

    .logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* --- Profile info --- */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .profile h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .profile p {
      font-size: 0.95rem;
      color: #aaaaaa;
      line-height: 1.5;
      max-width: 480px;
    }

    /* --- Link buttons --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid #68D570;
      background: transparent;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn:hover {
      background: #68D570;
      color: #202020;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn i {
      font-size: 1.2rem;
    }

    /* --- Social icons row --- */
    .socials {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2e2e2e;
      color: #68D570;
      text-decoration: none;
      font-size: 1.4rem;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .social-link:hover {
      background: #68D570;
      color: #202020;
      transform: translateY(-2px);
    }

    /* --- Contact modal overlay --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      position: relative;
      border: 1px solid #383838;
    }

    .modal h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #68D570;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .modal-close:hover { color: #ffffff; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cccccc;
    }

    .form-group input,
    .form-group textarea {
      background: #1a1a1a;
      border: 1.5px solid #383838;
      border-radius: 8px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #68D570;
    }

    .form-group textarea { min-height: 110px; }

    .form-submit {
      width: 100%;
      padding: 14px;
      background: #68D570;
      color: #202020;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .form-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    .form-submit:active { transform: translateY(0); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-message {
      margin-top: 12px;
      font-size: 0.9rem;
      text-align: center;
      min-height: 20px;
    }

    .form-message.success { color: #68D570; }
    .form-message.error { color: #ff6b6b; }

    /* --- Footer --- */
    footer {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #555555;
    }
  </style>
</head>

  <!-- Contact Modal -->
  <div class="modal-overlay" id="contactModal" onclick="handleOverlayClick(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <h2>Get in Touch</h2>

      <form id="contactForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="form-submit" id="submitBtn">Send Message</button>
        <p class="form-message" id="formMessage"></p>
      </form>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────
    // CONTACT FORM — powered by Formspree (free tier)
    //
    // SETUP STEPS:
    //   1. Go to https://formspree.io and sign up for free
    //   2. Create a new form and set the destination email to alanhorne7@gmail.com
    //   3. Copy your form endpoint (looks like: https://formspree.io/f/xxxxxxxx)
    //   4. Paste it into FORM_ENDPOINT below, replacing the placeholder
    // ─────────────────────────────────────────────────────────────────
    const FORM_ENDPOINT = 'https://formspree.io/f/mzdwqpkp';

    function openModal() {
      document.getElementById('contactModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('contactModal').classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('formMessage').textContent = '';
      document.getElementById('formMessage').className = 'form-message';
      document.getElementById('contactForm').reset();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('contactModal')) closeModal();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMessage');

      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.textContent = '';
      msg.className = 'form-message';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
      };

      try {
        const res = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          msg.textContent = '✓ Message sent! I\'ll be in touch soon.';
          msg.classList.add('success');
          document.getElementById('contactForm').reset();
          setTimeout(closeModal, 2500);
        } else {
          throw new Error('Server error');
        }
      } catch {
        msg.textContent = 'Something went wrong. Please try again.';
        msg.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    }
  </script>
